- id: u15
  n: 15
  tp: lukin e sitelen
  title: Reading sitelen pona
  focus: reading glyphs
  glyph: lukin
  words: []
  lesson:
    idea: "Every Toki Pona word has one sitelen pona glyph. Read them left to right, like Latin letters. Names sit in a cartouche, spelled letter by letter."
    points:
      - "One glyph = one word, so a sentence is a row of pictures you already know."
      - "Many glyphs show their meaning: suno is a sun, tomo a roof, oko an eye."
      - "This checkpoint is written in sitelen pona only — tap a line to see it in Latin."
    examples:
      - { tok: "jan lili li lukin e waso.", en: "A child sees a bird." }
      - { tok: "suno li lon sewi.", en: "The sun is in the sky." }
      - { tok: "mi jan Lisa.", en: "I'm Lisa." }
