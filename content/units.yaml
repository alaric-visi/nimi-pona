- id: u17
  n: 17
  tp: nimi ku
  title: Beyond pu
  focus: community words
  glyph: kijetesantakalu
  optional: true
  words: [kijetesantakalu, tonsi, monsuta, kipisi, lanpan, misikeke, soko, leko, epiku, majuna, meso, jasima, linluwi, ku, n]
  lesson:
    idea: "Toki Pona is alive. The dictionary ku (2021) recorded the words the community actually uses beyond the 120 of pu."
    points:
      - "Some fill gaps: tonsi (non-binary), misikeke (medicine), linluwi (network, internet)."
      - "Some are just loved: kijetesantakalu (raccoon) started as a joke and stuck."
      - "n is a thinking noise — hmm… — and the only word without a vowel."
    examples:
      - { tok: "kijetesantakalu li suwi mute.", en: "Raccoons are very cute." }
      - { tok: "ijo ni li epiku!", en: "This is epic!" }
      - { tok: "n... mi sona ala.", en: "Hmm… I don't know." }
  checkpoint:
    lines:
      - { tok: "kijetesantakalu li lon poki jaki.", en: "A raccoon is in the trash can." }
      - { tok: "ona li lanpan e moku.", en: "It grabs some food." }
