# Toki Pona vocabulary — human-authored source of truth (Phase 1 schema).
#
#   id        the word, lower case
#   tier      pu          one of the 120 words of Toki Pona: The Language of Good (2014)
#             pu-synonym  alternative words listed in pu (kin = a, namako = sin, oko = lukin)
#             ku          widely used words recorded in ku (2021). [verify] against Linku usage categories
#   roles     grammatical functions (from pu), NOT English parts of speech:
#             content | particle | pronoun | preverb | preposition | number | interjection
#   themes    semantic topics used for filtering and lessons (a word may have several)
#   concept   short display line naming the word's semantic space
#   glosses   English words that are acceptable answers (used for grading and distractor filtering)
#   synonyms  word ids that mean (nearly) the same — never offered as quiz distractors
#   variants  alternative spellings (not separate cards)
#   notes     one-line usage note shown on the card
#   sensitive true = excluded from games unless the learner opts in
#   glyph     sitelen pona asset key; defaults to id (Phase 2 supplies assets)
#
# Example sentences live in sentences.yaml and are linked automatically by the words they use.

# ── particles & grammar words ───────────────────────────────────────────────
- id: li
  tier: pu
  roles: [particle]
  themes: [grammar]
  concept: separates the subject from what is said about it
  glosses: [predicate marker]
  notes: Not used when the subject is just "mi" or "sina" — "mi pona", but "jan li pona".

- id: e
  tier: pu
  roles: [particle]
  themes: [grammar]
  concept: marks the direct object
  glosses: [object marker]
  notes: Repeat it for several objects — "mi moku e kili e pan".

- id: la
  tier: pu
  roles: [particle]
  themes: [grammar, time]
  concept: "context marker: [context] la [sentence]"
  glosses: [context marker, if, when]
  notes: Sets the scene for what follows — "tenpo pimeja la mi lape" (at night, I sleep).

- id: pi
  tier: pu
  roles: [particle]
  themes: [grammar]
  concept: "of — regroups the two or more words after it"
  glosses: [of]
  notes: Always needs at least two words after it — "jan pi toki pona", never "jan pi toki".

- id: o
  tier: pu
  roles: [particle]
  themes: [grammar]
  concept: "commands and wishes; calling someone: O!"
  glosses: [command marker, vocative, hey]
  notes: Replaces "li" in commands — "o kama!" — and follows a name to address someone — "jan Lisa o".

- id: en
  tier: pu
  roles: [particle]
  themes: [grammar]
  concept: and (joins subjects only)
  glosses: [and]
  notes: Only between subjects — "mi en sina li toki". Repeat "e" or "li" elsewhere.

- id: anu
  tier: pu
  roles: [particle]
  themes: [grammar]
  concept: or
  glosses: [or]
  notes: '"... anu seme?" turns a statement into a question — "sina pona anu seme?"'

- id: seme
  tier: pu
  roles: [particle]
  themes: [grammar]
  concept: "what? which? who? — question word"
  glosses: [what, which, who]
  notes: Goes in the place of the answer — "sina moku e seme?" (you eat what?).

- id: taso
  tier: pu
  roles: [particle, content]
  themes: [grammar]
  concept: but, however; only, just
  glosses: [but, however, only, just, merely]
  notes: At the start of a sentence it means "but"; after a word it means "only".

- id: a
  tier: pu
  roles: [interjection]
  themes: [grammar]
  concept: "ah! oh! ha! — emotion or emphasis"
  glosses: [ah, oh, ha, wow]
  synonyms: [kin]
  notes: Alone as an exclamation, or after a phrase for emphasis — "pona a!"

- id: kin
  tier: pu-synonym
  roles: [particle]
  themes: [grammar]
  concept: also, too, indeed (emphasis)
  glosses: [also, too, indeed, really, even]
  synonyms: [a]
  notes: Listed in pu as a synonym of "a"; in practice used to mean "too / indeed".

- id: n
  tier: ku
  roles: [interjection]
  themes: [grammar]
  concept: "hmm… um… (thinking)"
  glosses: [hmm, um, uh, er]
  notes: A syllabic nasal — the only word that breaks the usual sound rules.

